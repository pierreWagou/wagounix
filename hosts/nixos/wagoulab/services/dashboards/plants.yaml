views:
  - title: Plants
    type: sections
    sections:
      # Alert banner — only visible when a plant needs water
      - type: grid
        column_span: 2
        cards:
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.soil_sensor_tomate_soil_moisture
                below: 35
            card:
              type: tile
              entity: sensor.soil_sensor_tomate_soil_moisture
              name: "Tomate needs water!"
              icon: mdi:water-alert
              color: red
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.soil_sensor_lavande_soil_moisture
                below: 15
            card:
              type: tile
              entity: sensor.soil_sensor_lavande_soil_moisture
              name: "Lavande needs water!"
              icon: mdi:water-alert
              color: red
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.soil_sensor_malva_bleu_soil_moisture
                below: 25
            card:
              type: tile
              entity: sensor.soil_sensor_malva_bleu_soil_moisture
              name: "Malva Bleu needs water!"
              icon: mdi:water-alert
              color: red
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.soil_sensor_malva_jaune_soil_moisture
                below: 25
            card:
              type: tile
              entity: sensor.soil_sensor_malva_jaune_soil_moisture
              name: "Malva Jaune needs water!"
              icon: mdi:water-alert
              color: red

      # Tomato
      - cards:
          - type: heading
            heading: Tomato
          - type: tile
            entity: sensor.soil_sensor_tomate_soil_moisture
            name: Moisture
            icon: mdi:water-percent
            color: blue
          - type: tile
            entity: sensor.soil_sensor_tomate_temperature
            name: Temperature
            icon: mdi:thermometer
            color: orange
          - type: tile
            entity: sensor.soil_sensor_tomate_battery
            name: Battery
            icon: mdi:battery
            color: green
          - type: history-graph
            title: Moisture (24h)
            entities:
              - sensor.soil_sensor_tomate_soil_moisture
            hours_to_show: 24

      # Lavande
      - cards:
          - type: heading
            heading: Lavande
          - type: tile
            entity: sensor.soil_sensor_lavande_soil_moisture
            name: Moisture
            icon: mdi:water-percent
            color: blue
          - type: tile
            entity: sensor.soil_sensor_lavande_temperature
            name: Temperature
            icon: mdi:thermometer
            color: orange
          - type: tile
            entity: sensor.soil_sensor_lavande_battery
            name: Battery
            icon: mdi:battery
            color: green
          - type: history-graph
            title: Moisture (24h)
            entities:
              - sensor.soil_sensor_lavande_soil_moisture
            hours_to_show: 24

      # Malva Bleu
      - cards:
          - type: heading
            heading: Malva Bleu
          - type: tile
            entity: sensor.soil_sensor_malva_bleu_soil_moisture
            name: Moisture
            icon: mdi:water-percent
            color: blue
          - type: tile
            entity: sensor.soil_sensor_malva_bleu_temperature
            name: Temperature
            icon: mdi:thermometer
            color: orange
          - type: tile
            entity: sensor.soil_sensor_malva_bleu_battery
            name: Battery
            icon: mdi:battery
            color: green
          - type: history-graph
            title: Moisture (24h)
            entities:
              - sensor.soil_sensor_malva_bleu_soil_moisture
            hours_to_show: 24

      # Malva Jaune
      - cards:
          - type: heading
            heading: Malva Jaune
          - type: tile
            entity: sensor.soil_sensor_malva_jaune_soil_moisture
            name: Moisture
            icon: mdi:water-percent
            color: blue
          - type: tile
            entity: sensor.soil_sensor_malva_jaune_temperature
            name: Temperature
            icon: mdi:thermometer
            color: orange
          - type: tile
            entity: sensor.soil_sensor_malva_jaune_battery
            name: Battery
            icon: mdi:battery
            color: green
          - type: history-graph
            title: Moisture (24h)
            entities:
              - sensor.soil_sensor_malva_jaune_soil_moisture
            hours_to_show: 24

      # All plants overview
      - cards:
          - type: heading
            heading: All Plants — Moisture Trends
          - type: history-graph
            title: Moisture (7 days)
            entities:
              - entity: sensor.soil_sensor_tomate_soil_moisture
                name: Tomato
              - entity: sensor.soil_sensor_lavande_soil_moisture
                name: Lavande
              - entity: sensor.soil_sensor_malva_bleu_soil_moisture
                name: Malva Bleu
              - entity: sensor.soil_sensor_malva_jaune_soil_moisture
                name: Malva Jaune
            hours_to_show: 168
