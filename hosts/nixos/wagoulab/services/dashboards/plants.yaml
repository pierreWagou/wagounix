views:
  # ── View 1: Overview ──
  - title: Overview
    type: sections
    sections:
      # Alerts
      - cards:
          - type: heading
            heading: Alerts
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.soil_sensor_tomate_soil_moisture
                below: 35
            card:
              type: tile
              entity: sensor.soil_sensor_tomate_soil_moisture
              name: "Tomate"
              icon: mdi:water-alert
              color: red
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.soil_sensor_lavande_soil_moisture
                below: 15
            card:
              type: tile
              entity: sensor.soil_sensor_lavande_soil_moisture
              name: "Lavande"
              icon: mdi:water-alert
              color: red
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.soil_sensor_malva_bleu_soil_moisture
                below: 25
            card:
              type: tile
              entity: sensor.soil_sensor_malva_bleu_soil_moisture
              name: "Malva Bleu"
              icon: mdi:water-alert
              color: red
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.soil_sensor_malva_jaune_soil_moisture
                below: 25
            card:
              type: tile
              entity: sensor.soil_sensor_malva_jaune_soil_moisture
              name: "Malva Jaune"
              icon: mdi:water-alert
              color: red

      # Moisture
      - cards:
          - type: heading
            heading: Moisture
          - type: tile
            entity: sensor.soil_sensor_tomate_soil_moisture
            name: "Tomate"
            icon: mdi:flower-tulip
            color: blue
          - type: tile
            entity: sensor.soil_sensor_lavande_soil_moisture
            name: "Lavande"
            icon: mdi:flower-tulip
            color: blue
          - type: tile
            entity: sensor.soil_sensor_malva_bleu_soil_moisture
            name: "Malva Bleu"
            icon: mdi:flower-tulip
            color: blue
          - type: tile
            entity: sensor.soil_sensor_malva_jaune_soil_moisture
            name: "Malva Jaune"
            icon: mdi:flower-tulip
            color: blue

      # Moisture Trends
      - cards:
          - type: heading
            heading: Moisture Trends (7 days)
          - type: history-graph
            entities:
              - entity: sensor.soil_sensor_tomate_soil_moisture
                name: Tomate
              - entity: sensor.soil_sensor_lavande_soil_moisture
                name: Lavande
              - entity: sensor.soil_sensor_malva_bleu_soil_moisture
                name: Malva Bleu
              - entity: sensor.soil_sensor_malva_jaune_soil_moisture
                name: Malva Jaune
            hours_to_show: 168

      # Temperature Trends
      - cards:
          - type: heading
            heading: Temperature Trends (7 days)
          - type: history-graph
            entities:
              - entity: sensor.soil_sensor_tomate_temperature
                name: Tomate
              - entity: sensor.soil_sensor_lavande_temperature
                name: Lavande
              - entity: sensor.soil_sensor_malva_bleu_temperature
                name: Malva Bleu
              - entity: sensor.soil_sensor_malva_jaune_temperature
                name: Malva Jaune
            hours_to_show: 168

  # ── View 2: Details ──
  - title: Details
    type: sections
    sections:
      # Tomato
      - type: grid
        cards:
          - type: heading
            heading: "Tomate"
          - type: tile
            entity: sensor.soil_sensor_tomate_soil_moisture
            name: Moisture
            icon: mdi:water-percent
            color: blue
          - type: tile
            entity: sensor.soil_sensor_tomate_temperature
            name: Temperature
            icon: mdi:thermometer
            color: orange
          - type: tile
            entity: sensor.soil_sensor_tomate_battery
            name: Battery
            icon: mdi:battery
            color: green
          - type: history-graph
            title: Moisture (24h)
            entities:
              - sensor.soil_sensor_tomate_soil_moisture
            hours_to_show: 24

      # Lavande
      - type: grid
        cards:
          - type: heading
            heading: "Lavande"
          - type: tile
            entity: sensor.soil_sensor_lavande_soil_moisture
            name: Moisture
            icon: mdi:water-percent
            color: blue
          - type: tile
            entity: sensor.soil_sensor_lavande_temperature
            name: Temperature
            icon: mdi:thermometer
            color: orange
          - type: tile
            entity: sensor.soil_sensor_lavande_battery
            name: Battery
            icon: mdi:battery
            color: green
          - type: history-graph
            title: Moisture (24h)
            entities:
              - sensor.soil_sensor_lavande_soil_moisture
            hours_to_show: 24

      # Malva Bleu
      - type: grid
        cards:
          - type: heading
            heading: "Malva Bleu"
          - type: tile
            entity: sensor.soil_sensor_malva_bleu_soil_moisture
            name: Moisture
            icon: mdi:water-percent
            color: blue
          - type: tile
            entity: sensor.soil_sensor_malva_bleu_temperature
            name: Temperature
            icon: mdi:thermometer
            color: orange
          - type: tile
            entity: sensor.soil_sensor_malva_bleu_battery
            name: Battery
            icon: mdi:battery
            color: green
          - type: history-graph
            title: Moisture (24h)
            entities:
              - sensor.soil_sensor_malva_bleu_soil_moisture
            hours_to_show: 24

      # Malva Jaune
      - type: grid
        cards:
          - type: heading
            heading: "Malva Jaune"
          - type: tile
            entity: sensor.soil_sensor_malva_jaune_soil_moisture
            name: Moisture
            icon: mdi:water-percent
            color: blue
          - type: tile
            entity: sensor.soil_sensor_malva_jaune_temperature
            name: Temperature
            icon: mdi:thermometer
            color: orange
          - type: tile
            entity: sensor.soil_sensor_malva_jaune_battery
            name: Battery
            icon: mdi:battery
            color: green
          - type: history-graph
            title: Moisture (24h)
            entities:
              - sensor.soil_sensor_malva_jaune_soil_moisture
            hours_to_show: 24
