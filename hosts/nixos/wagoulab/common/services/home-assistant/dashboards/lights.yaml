views:
  - title: Lights
    type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Living Room
          - type: custom:auto-entities
            card:
              type: grid
              columns: 3
              square: false
            card_param: cards
            filter:
              include:
                - entity_id:
                    - light.kitchen
                    - light.tv
                    - light.dining
                  options:
                    type: tile
                    features:
                      - type: light-brightness
          - type: custom:auto-entities
            card:
              type: grid
              columns: 3
              square: false
            card_param: cards
            filter:
              include:
                - domain: light
                  area: Living Room
                  options:
                    type: tile
                    features:
                      - type: light-brightness
              exclude:
                - entity_id:
                    - light.kitchen
                    - light.tv
                    - light.dining
                    - light.library
                    - light.workshop

